version: '3.8'

services:
  # 1. FastAPI Media Server & Transcoder Worker
  media-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamvault-media-server
    restart: unless-stopped
    network_mode: host
    environment:
      - MEDIA_SERVER_HOST=127.0.0.1
      - MEDIA_SERVER_PORT=8000
      - MEDIA_INCOMING_DIR=/media/incoming
      - MEDIA_LIBRARY_DIR=/media/library
      - MEDIA_TEMP_DIR=/media/temp
      - HMAC_STREAM_SECRET=${HMAC_STREAM_SECRET}
      - ADMIN_API_SECRET=${ADMIN_API_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TMDB_API_READ_ACCESS_TOKEN=${TMDB_API_READ_ACCESS_TOKEN}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - ARIA2_RPC_HOST=127.0.0.1
      - ARIA2_RPC_PORT=6800
      - ARIA2_RPC_SECRET=${ARIA2_RPC_SECRET}
    volumes:
      - ./media/incoming:/media/incoming
      - ./media/library:/media/library
      - ./media/temp:/media/temp
      - /dev/dri:/dev/dri # Hardware Acceleration passthrough for Intel/AMD VAAPI

  # 2. Aria2c High-Performance Download Daemon
  aria2:
    image: p3terx/aria2-pro
    container_name: streamvault-aria2
    restart: unless-stopped
    network_mode: host
    command: --rpc-listen-all=false
    environment:
      - RPC_SECRET=${ARIA2_RPC_SECRET}
      - RPC_PORT=6800
      - RPC_LISTEN_ALL=false
      - LISTEN_PORT=6888
      - DOWNLOAD_DIR=/media/incoming
    volumes:
      - ./media/incoming:/media/incoming
      - ./media/aria2_config:/config

  # 3. Production Frontend Nginx Web Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamvault-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_MEDIA_SERVER_URL=${VITE_MEDIA_SERVER_URL}
    volumes:
      - ./media/library:/media/library

  # 4. Decoupled Local Admin Panel (127.0.0.1:4000)
  admin-local:
    build:
      context: .
      dockerfile: admin-local/Dockerfile
    container_name: streamvault-admin-local
    restart: unless-stopped
    network_mode: host
    environment:
      - ADMIN_HOST=127.0.0.1
      - ADMIN_PORT=4000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
