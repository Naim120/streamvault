<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23E50914'>▶</text></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#E50914" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    
    <!-- SEO Meta Tags -->
    <title>StreamVault — Watch Movies, TV Series & Originals in HD</title>
    <meta name="description" content="StreamVault is a high-performance streaming platform featuring adaptive 1080p HD playback, multi-language audio tracks, custom subtitles, and instant cross-device sync." />
    <meta name="keywords" content="StreamVault, watch movies online, TV series streaming, HD streaming platform, multi-audio movies" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StreamVault" />
    <meta property="og:title" content="StreamVault — Watch Movies, TV Series & Originals in HD" />
    <meta property="og:description" content="StreamVault is a high-performance streaming platform featuring adaptive 1080p HD playback, multi-language audio tracks, custom subtitles, and instant cross-device sync." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StreamVault — Watch Movies, TV Series & Originals in HD" />
    <meta name="twitter:description" content="StreamVault is a high-performance streaming platform featuring adaptive 1080p HD playback, multi-language audio tracks, custom subtitles, and instant cross-device sync." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- JSON-LD Structured Data: WebSite & Organization for Google Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://streamvault.local/#organization",
          "name": "StreamVault",
          "url": "https://streamvault.local/",
          "logo": "https://streamvault.local/favicon.svg",
          "description": "Next-generation OTT streaming media engine featuring low-latency HLS, multi-track audio, and smart metadata enrichment."
        },
        {
          "@type": "WebSite",
          "@id": "https://streamvault.local/#website",
          "url": "https://streamvault.local/",
          "name": "StreamVault",
          "publisher": {
            "@id": "https://streamvault.local/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://streamvault.local/home?tab=search&q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <script>
      (function() {
        var isFilterable = function(args) {
          for (var i = 0; i < args.length; i++) {
            var str = typeof args[i] === 'string' ? args[i] : (args[i] && args[i].message) || '';
            if (str && (str.indexOf('No available adapters') !== -1 || str.indexOf('cast_sender') !== -1)) {
              return true;
            }
          }
          return false;
        };
        var origWarn = console.warn;
        console.warn = function() {
          if (isFilterable(arguments)) return;
          return origWarn.apply(console, arguments);
        };
        var origErr = console.error;
        console.error = function() {
          if (isFilterable(arguments)) return;
          return origErr.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body style="margin:0; background-color:#141414; color:#ffffff; font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;" class="bg-black text-white antialiased selection:bg-red-600 selection:text-white">
    <div id="root">
      <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#141414; color:#ffffff; font-family:system-ui,-apple-system,sans-serif; text-align:center; padding:20px;">
        <style>
          @keyframes sv-pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.85; transform:scale(0.98); } }
          @keyframes sv-bar { 0% { transform:translateX(-100%); } 100% { transform:translateX(200%); } }
        </style>
        <div style="animation:sv-pulse 2s infinite ease-in-out; margin-bottom:24px;">
          <h1 style="color:#E50914; font-size:clamp(2rem,6vw,3.2rem); font-weight:900; letter-spacing:0.25em; font-family:monospace,sans-serif; margin:0 0 6px 0; text-transform:uppercase;">
            STREAMVAULT
          </h1>
          <p style="color:#a3a3a3; font-size:13px; margin:0; letter-spacing:0.05em;">
            Unlimited movies, TV shows, and more
          </p>
        </div>
        <div style="width:160px; height:3px; background:rgba(255,255,255,0.1); border-radius:99px; overflow:hidden; position:relative;">
          <div style="position:absolute; top:0; left:0; width:50%; height:100%; background:#E50914; border-radius:99px; animation:sv-bar 1.4s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
